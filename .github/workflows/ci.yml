name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --verbose

  netns-linux:
    name: Privileged netns (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Fetch dependencies
        run: cargo fetch

      # 08D1 §16.6: real /32 and /128 add/read-back, <5s event restore,
      # 1000-duplicate flatness and foreign-row safety in a disposable
      # network namespace.
      #
      # The test binaries are built as the runner user, before sudo. The
      # root-only script never calls cargo/rustup and only receives absolute
      # binary paths (ip netns exec keeps the filesystem path).
      - name: Build privileged acceptance binaries
        run: |
          cargo test --test linux_route_registry_netns --no-run
          cargo test --test netns_monitor_probe --no-run

      - name: Resolve privileged acceptance binaries
        id: netns_bins
        run: |
          REGISTRY_BIN="$(ls -t target/debug/deps/linux_route_registry_netns-* | grep -v '\.d$' | head -1)"
          MONITOR_BIN="$(ls -t target/debug/deps/netns_monitor_probe-* | grep -v '\.d$' | head -1)"
          test -x "$REGISTRY_BIN"
          test -x "$MONITOR_BIN"
          echo "registry=$PWD/$REGISTRY_BIN" >> "$GITHUB_OUTPUT"
          echo "monitor=$PWD/$MONITOR_BIN" >> "$GITHUB_OUTPUT"

      - name: Verify required privileged tests are present
        env:
          LESHY_REGISTRY_TEST_BIN: ${{ steps.netns_bins.outputs.registry }}
          LESHY_MONITOR_PROBE_BIN: ${{ steps.netns_bins.outputs.monitor }}
        run: |
          REGISTRY_LIST="$("$LESHY_REGISTRY_TEST_BIN" --list --ignored)"
          MONITOR_LIST="$("$LESHY_MONITOR_PROBE_BIN" --list --ignored)"
          echo "$REGISTRY_LIST"
          echo "$MONITOR_LIST"
          for test in \
            real_kernel_add_readback_delete_and_conflict_safety \
            real_kernel_dual_stack_through_one_device \
            ipv6_route_event_restores_externally_deleted_128 \
            real_kernel_interface_recreate_invalidates_old_ifindex
          do
            grep -q "$test" <<<"$REGISTRY_LIST" || { echo "missing registry test: $test"; exit 1; }
          done
          for test in \
            production_monitor_delivers_invalidations \
            raw_monitor_sees_route_churn
          do
            grep -q "$test" <<<"$MONITOR_LIST" || { echo "missing monitor test: $test"; exit 1; }
          done

      - name: Run privileged netns acceptance
        env:
          LESHY_REGISTRY_TEST_BIN: ${{ steps.netns_bins.outputs.registry }}
          LESHY_MONITOR_PROBE_BIN: ${{ steps.netns_bins.outputs.monitor }}
        run: |
          sudo -E env \
            LESHY_REGISTRY_TEST_BIN="$LESHY_REGISTRY_TEST_BIN" \
            LESHY_MONITOR_PROBE_BIN="$LESHY_MONITOR_PROBE_BIN" \
            ./tests/linux-route-registry-netns.sh

      # 08D1 Production Plan C3: the product's own SIGTERM path must remove
      # exactly the local-owned rows and leave a same-prefix foreign fixture
      # untouched, with a clean exit status.
      - name: Build SIGTERM acceptance binaries
        run: |
          cargo build --bin leshy
          cargo test --test linux_sigterm_cleanup --no-run

      - name: Resolve SIGTERM acceptance binaries
        id: sigterm_bins
        run: |
          LESHY_BIN="$PWD/target/debug/leshy"
          GATE_BIN="$(ls -t target/debug/deps/linux_sigterm_cleanup-* | grep -v '\.d$' | head -1)"
          test -x "$LESHY_BIN"
          test -x "$GATE_BIN"
          echo "leshy=$LESHY_BIN" >> "$GITHUB_OUTPUT"
          echo "gate=$PWD/$GATE_BIN" >> "$GITHUB_OUTPUT"

      - name: Run privileged SIGTERM acceptance
        env:
          LESHY_BIN: ${{ steps.sigterm_bins.outputs.leshy }}
          LESHY_SIGTERM_TEST_BIN: ${{ steps.sigterm_bins.outputs.gate }}
          LESHY_SIGTERM_LOG: ${{ github.workspace }}/sigterm-gate.log
        run: |
          sudo -E env \
            LESHY_BIN="$LESHY_BIN" \
            LESHY_SIGTERM_TEST_BIN="$LESHY_SIGTERM_TEST_BIN" \
            LESHY_SIGTERM_LOG="$LESHY_SIGTERM_LOG" \
            ./tests/linux-sigterm-netns.sh

  integration-linux:
    name: Integration Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run integration tests
        run: docker compose -f tests/docker/docker-compose.yml up --build --abort-on-container-exit --exit-code-from test-runner
        env:
          COMPOSE_BAKE: "true"

      - name: Cleanup
        if: always()
        run: docker compose -f tests/docker/docker-compose.yml down

  integration-macos:
    name: Integration Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release

      - name: Set up CoreDNS and network
        run: |
          brew install coredns

          # Create loopback aliases for DNS servers and gateway
          sudo ifconfig lo0 alias 172.28.0.1
          sudo ifconfig lo0 alias 172.28.0.10
          sudo ifconfig lo0 alias 172.28.0.20
          sudo ifconfig lo0 alias 172.28.0.30

          # Start CoreDNS instances one at a time with verification
          for cfg in Corefile.public Corefile.corporate Corefile.broken; do
            sudo coredns -conf "tests/docker/coredns/$cfg" &
            pid=$!
            name="${cfg#Corefile.}"
            echo $pid > "/tmp/coredns-${name}.pid"
            sleep 1
            if ! kill -0 $pid 2>/dev/null; then
              echo "::warning::CoreDNS $name (PID $pid) failed to start"
            else
              echo "CoreDNS $name started (PID $pid)"
            fi
          done

          sleep 2

      - name: Install test dependencies
        run: |
          python3 -m venv /tmp/test-venv
          /tmp/test-venv/bin/pip install pytest dnspython

      - name: Run integration tests
        run: |
          sudo -E /tmp/test-venv/bin/pytest -v --tb=short tests/docker/test_integration.py
        env:
          LESHY_BIN: target/release/leshy
          LESHY_CONFIG_DIR: tests/docker/configs

      - name: Cleanup
        if: always()
        run: |
          sudo kill $(cat /tmp/coredns-public.pid 2>/dev/null) 2>/dev/null || true
          sudo kill $(cat /tmp/coredns-corporate.pid 2>/dev/null) 2>/dev/null || true
          sudo kill $(cat /tmp/coredns-broken.pid 2>/dev/null) 2>/dev/null || true
          sudo ifconfig lo0 -alias 172.28.0.1 2>/dev/null || true
          sudo ifconfig lo0 -alias 172.28.0.10 2>/dev/null || true
          sudo ifconfig lo0 -alias 172.28.0.20 2>/dev/null || true
          sudo ifconfig lo0 -alias 172.28.0.30 2>/dev/null || true

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact: leshy-linux-x86_64
          - os: macos-latest
            artifact: leshy-macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --verbose

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/leshy
